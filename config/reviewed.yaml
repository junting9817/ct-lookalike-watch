    verdict: unknown
    checked: 2026-09-26
    note: >
      Hyphenated form of the bank's own name, 49 certificates continuous since 2018. That pattern fits a defensive
      registration by Woori Bank, but nothing here proves it. Needs a WHOIS check by a person.
  - domain: shinhan-card.com
    verdict: unknown
